application.nosliw-story.datasource.tag = 


# Resource
resource.cached=false
resource.file-load-mode = always
resource.file-load-resources = "script","uiModuleDecoration","uipage","activityPlugin","uiTag","script","decoration_script","uitagscript", "converter", "operation"



runtime.rhino.script-export = false
runtime.rhino.script-export-path = ${application.nosliw-static.temporary.path}/scriptexport/scripts



uitag.definition-path = ${global.path.library}/uitag
codetable.data-path = ${global.path.library}/codetable
script.definition-path = ${global.path.library}/script
configure.data-path = ${global.path.library}/configure
taskinterface.path = ${global.path.library}/serviceinterface

division.script.definition-path = ${global.path.library}/brick_definition/script

division.manual.definition-path = ${global.path.library}/brick_definition/manual
division.manual.execute-path = ${global.path.temp}/manualbundleexecute




# datasource for data type
datasource.datatype.username=admin
datasource.datatype.password=admin
datasource.datatype.address = localhost
datasource.datatype.jdbc-url: jdbc:mysql://${datasource.datatype.address}/nosliw?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC&autoReconnect=true

# datasource for data collection
datasource.datacollection.username=admin
datasource.datacollection.password=admin
datasource.datacollection.address = localhost
datasource.datacollection.jdbc-url: jdbc:mysql://${datasource.datacollection.address}/nosliw_datacollection?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC&autoReconnect=true


spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Generate DDL script and save it to a file
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=./tables.sql
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-source=metadata
