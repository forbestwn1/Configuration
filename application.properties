application.nosliw-datasource.port = 8085
application.nosliw-datasource.name = datasource
application.nosliw-datasource.baseurl = http://${application.nosliw-datasource.name}:${application.nosliw-datasource.port}/nosliw/datasource/

application.nosliw-static.port = 8081
application.nosliw-static.name = static
application.nosliw-static.baseurl = http://${application.nosliw-datasource.name}:${application.nosliw-datasource.port}/nosliw/static/


application.nosliw-core.port = 8080
application.nosliw-core.name = core
application.nosliw-core.baseurl = http://${application.nosliw-core.name}:${application.nosliw-core.port}/nosliw/core/

application.nosliw-story.port = 8083
application.nosliw-story.name = story
application.nosliw-story.baseurl = http://${application.nosliw-story.name}:${application.nosliw-story.port}/nosliw/story/



# Database authentication credentials
spring.datasource.username=admin
spring.datasource.password=admin

# Optional: Spring Boot usually auto-detects this based on the URL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url: jdbc:mysql://localhost/nosliw?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC&autoReconnect=true


